name: Deploy Curio.Byte to VPS

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
          ssh-passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}

      - name: Deploy and Restart via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'REMOTE'
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            cd ~/Repos/daniel-danielkill.online
            git pull origin main
            
            # Navigate to bot directory and install dependencies if needed
            cd bots/Curio.Byte
            npm ci --omit=dev || npm install --production
            
            # Restart user service (zero sudo password prompts)
            systemctl --user restart curio-byte
            echo "✅ Successfully deployed and restarted Curio.Byte on VPS!"
          REMOTE
