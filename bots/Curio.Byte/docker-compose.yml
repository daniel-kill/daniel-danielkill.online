services:
  curio-byte:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: curio-byte
    restart: unless-stopped
    volumes:
      - ./.private:/usr/src/app/.private
      - ./backups:/usr/src/app/backups
      - ./data:/usr/src/app/data
    environment:
      - DB_PATH=/usr/src/app/data/curio.db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
